name: Deploy

# Deploys to Cloudflare Workers. Needs one repository secret:
#   CLOUDFLARE_API_TOKEN  (Workers Scripts, D1 and Workers R2 Storage: Edit)
# The account ID, database and bucket names are in wrangler.jsonc.
on:
  push:
    branches: [main, claude/awesome-knuth-v2adha]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
      NEXT_PUBLIC_SITE_URL: https://cou-hackathon.cou-hackathon.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Migrations are additive, so they run before the new code goes live.
      - run: pnpm exec wrangler d1 migrations apply cou-hackathon --remote
      - run: pnpm exec opennextjs-cloudflare build
      - run: pnpm exec wrangler deploy
      - name: Smoke test
        run: |
          sleep 5
          for path in / /register /api/v1/leaderboard; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$NEXT_PUBLIC_SITE_URL$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
